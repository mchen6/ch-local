name: shim

# ch-shim, the native per-session shim (shim/): tested and built for six
# targets, its dependencies audited, and, on a tag shim-v<version>, published
# to npm as @countinghouse/ch-shim plus one package per target (the esbuild
# pattern), under npm trusted publishing (OIDC: no token in this repository;
# npm attaches provenance). Release 1 ships unsigned (maintainer's decision, 2026-11-14); the
# signing job below is a disabled placeholder until the accounts exist.

on:
  push:
    branches: [main]
    paths: ['shim/**', 'npm-shim/**', '.github/workflows/shim.yml']
    tags: ['shim-v*']
  pull_request:
    branches: [main]
    paths: ['shim/**', 'npm-shim/**', '.github/workflows/shim.yml']
  workflow_dispatch:

concurrency:
  group: shim-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Every action is pinned to a full commit SHA (its tag in the comment), so a
# moved tag can't run in a job, least of all in publish, which can mint the
# npm OIDC token; checkout keeps no credentials.

env:
  CARGO_TERM_COLOR: never
  # the tools' versions, pinned; cargo-audit 0.23.0 (2026-11-10) waits
  # until it has had some weeks of use
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: The audit tools
        run: cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}" "cargo-deny@${CARGO_DENY_VERSION}"
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --locked check

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl): no glibc floor, so they run on
          # any Linux, old or new, glibc or musl
          - {target: x86_64-unknown-linux-musl,  os: ubuntu-24.04,     npm: linux-x64}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, npm: linux-arm64}
          - {target: x86_64-apple-darwin,       os: macos-15-intel,   npm: darwin-x64}
          - {target: aarch64-apple-darwin,      os: macos-15,         npm: darwin-arm64}
          - {target: x86_64-pc-windows-msvc,    os: windows-2025,     npm: win32-x64}
          - {target: aarch64-pc-windows-msvc,   os: windows-11-arm,   npm: win32-arm64}
    defaults:
      run:
        shell: bash
        working-directory: shim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml) and the target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      # every leg runs on its own architecture, so the tests run natively
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: The binary
        id: bin
        run: |
          exe=ch-shim; [ "${{ runner.os }}" = Windows ] && exe=ch-shim.exe
          path="target/${{ matrix.target }}/release/$exe"
          ls -l "$path"
          [ "${{ runner.os }}" = Linux ] && { file "$path"; file "$path" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::not a static binary"; exit 1; }; }
          echo "path=shim/$path" >> "$GITHUB_OUTPUT"
      # the release binary itself runs (a bad link, a broken ad-hoc
      # signature, a missing library): the scaffold says so and exits 2
      - name: The release binary runs
        run: |
          set +e
          "../${{ steps.bin.outputs.path }}"; code=$?
          set -e
          [ "$code" = 2 ] || { echo "::error::the release binary exited $code, not 2"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ch-shim-${{ matrix.npm }}
          path: ${{ steps.bin.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # PLACEHOLDER, DISABLED: release 1 ships unsigned (maintainer's decision, 2026-11-14).
  # macOS notarization and Windows Authenticode signing come in a point
  # release once the company's accounts exist (early January). This job
  # will take the build artifacts, sign them, and hand the signed binaries
  # to publish, which will then need it.
  sign:
    if: false
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: echo "signing is not set up in release 1" && exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/shim-v')
    needs: [audit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # the OIDC token npm trusts; the only credential involved
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      # Before anything is assembled: the tag is shim-v<x.y.z> exactly (no
      # prerelease: one published without --tag would become npm's
      # "latest") and names shim/Cargo.toml's version. assemble.js checks
      # both again.
      - name: The tag names shim/Cargo.toml's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^shim-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not shim-v<x.y.z>"; exit 1; }
          cargo_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' shim/Cargo.toml | head -1)"
          [ "${TAG#shim-v}" = "$cargo_version" ] || { echo "::error::tag $TAG but shim/Cargo.toml says $cargo_version"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          node -e "
            const [a, b, c] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error('npm ' + [a, b, c].join('.') + ' is older than 11.5.1'); process.exit(1); }
          "
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ch-shim-*
          path: artifacts
      - name: Assemble the packages (the tag names the version)
        env:
          TAG: ${{ github.ref_name }}
        run: node npm-shim/assemble.js --version "${TAG#shim-v}" --artifacts artifacts --out dist/npm-shim
      - name: What each tarball holds
        run: for d in dist/npm-shim/*/; do (cd "$d" && npm pack --dry-run); done
      # the platform packages first, so the wrapper never names a version
      # that is not there yet; a package already at this version is skipped,
      # so a run that failed part-way can be re-run to finish
      - name: Publish
        run: |
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is published already"
            else
              (cd "$1" && npm publish --access public)
            fi
          }
          for d in dist/npm-shim/ch-shim-*; do publish "$d"; done
          publish dist/npm-shim/ch-shim
